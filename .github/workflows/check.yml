name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: make check
      # The runner's own Chrome: Ubuntu's chromium is a snap, which can't use the tests'
      # throwaway profile folders.
      - run: make browser-test
        env:
          CHROMIUM: google-chrome
          CHROMIUM_FLAGS: --no-sandbox
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-output
          path: test/browser/out/
          if-no-files-found: ignore
