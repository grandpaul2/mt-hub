name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Chromium for the browser tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q chromium-browser || sudo apt-get install -y -q chromium
          chromium --version
      - run: make check
      - run: make browser-test
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-output
          path: test/browser/out/
          if-no-files-found: ignore
